[project]
name = "visionctx"
version = "0.1.0"
description = "VisionCtx wearable camera demo server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pillow>=10",
  "numpy>=1.26",
  "zeroconf>=0.130",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["visionctx"]

[tool.setuptools.package-data]
visionctx = ["static/*", "tasks.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
